<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant Portal - Griffin Consulting LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-400">Griffin Consulting LMS — Student Portal</h1>
        <button id="logout-btn" class="px-4 py-2 bg-red-600/20 text-red-400 border border-red-600/30 hover:bg-red-600 hover:text-white rounded-lg text-sm transition">Sign Out</button>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-6 flex justify-between items-center">
            <div>
                <h2 id="welcome-banner" class="text-2xl font-bold">Welcome back, Learner!</h2>
                <p class="text-slate-400 text-sm mt-1">Select an active course below to access your training modules and media.</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Enrolled Courses List -->
            <div class="lg:col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
                <h3 class="text-lg font-semibold mb-4 text-blue-400">Available Courses</h3>
                <div id="student-course-list" class="space-y-3">
                    <p class="text-slate-400 text-sm">Loading courses...</p>
                </div>
            </div>

            <!-- Course Player / Lesson View Area -->
            <div id="lesson-viewer-container" class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-slate-300">Course Player</h3>
                <div id="active-lesson-display" class="text-center py-16 text-slate-500">
                    <p class="text-sm">Select a course and lesson from the left to start learning.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAuth, supabase } from './assets/js/app.js';
        import './assets/js/student.js'; // Imports student learning and viewer logic
        
        (async () => {
            const profile = await checkAuth('student');
            if (profile) {
                document.getElementById('welcome-banner').textContent = `Welcome back, ${profile.email}!`;
            }
        })();

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
