<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griffin Consulting LMS - Login</title>
    <!-- Tailwind CSS for rapid, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center h-screen m-0">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Griffin Consulting LMS</h1>
            <p class="text-slate-400 text-sm mt-1">Secure Learning & Training Portal</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Email Address</label>
                <input type="email" id="email" required placeholder="admin@griffin.com" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg transition duration-200 text-white shadow-lg shadow-blue-600/20">Sign In</button>
        </form>

        <p id="error-message" class="text-red-400 text-xs mt-4 text-center hidden"></p>
        
        <div class="mt-6 text-center text-xs text-slate-500">
            Protected Portal • Authorized Personnel Only
        </div>
    </div>

    <!-- Main application logic script -->
    <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
